<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料包</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#24382f;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:940px;margin:auto;padding:44px 24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d7ded5;padding-bottom:24px}.brand{font-weight:700;font-size:23px}.badge{font-size:12px;color:#53705e}h1{font-size:38px;letter-spacing:-1px;margin:46px 0 12px}p{color:#718075;line-height:1.7}.modes{display:flex;gap:12px;margin:28px 0}.mode{flex:1;text-align:left;border:1px solid #d7ded5;background:white;border-radius:14px;padding:18px;cursor:pointer;color:inherit}.mode[aria-pressed=true]{background:#e4ecdf;border-color:#487453}.mode span{display:block;margin-top:6px;font-size:12px;color:#718075}#messages{min-height:180px}.message{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;padding:20px 24px;background:white;border-radius:16px;margin:16px 0;border:1px solid #e2e7df}.question{background:#e4ecdf;margin-left:12%}.label{font-size:12px;color:#718075;margin-bottom:8px}form{background:white;padding:16px;border:1px solid #d7ded5;border-radius:18px}textarea{width:100%;resize:vertical;min-height:95px;border:0;outline:0;font:inherit;padding:8px;background:transparent}button:focus-visible,textarea:focus-visible{outline:2px solid #487453}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px}#send{background:#294d39;color:white;border:0;border-radius:10px;padding:12px 25px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#status{font-size:12px;color:#718075}#clear{border:0;background:transparent;color:#718075;cursor:pointer}footer{font-size:12px;color:#899389;margin-top:18px;text-align:center}@media(max-width:600px){main{padding:22px 16px}h1{font-size:28px}.modes{gap:6px}.mode{padding:12px}.question{margin-left:4%}}
</style><main><header><div class="brand">料包</div><span class="badge">苏州大学 2424401045 叶柏毅 计算机辅修 综合项目实践</span></header><h1>料包——会写规范通知和幽默笑话的语言大师</h1><p>选择你喜欢的回答方式，让解释更贴近你的需要。</p><div class="modes" role="group" aria-label="回答模式"><button class="mode" aria-pressed="true" data-mode="通俗">通俗<span>简单直白，容易理解</span></button><button class="mode" aria-pressed="false" data-mode="正式">正式<span>客观严谨，条理清晰</span></button><button class="mode" aria-pressed="false" data-mode="幽默">幽默<span>轻松表达，带点趣味</span></button></div><div style="text-align:right"><button id="clear">清空页面</button></div><section id="messages" aria-live="polite"><p id="empty">从一个你感兴趣的问题开始。</p></section><form id="form"><textarea id="question" aria-label="你的问题" placeholder="例如：什么是机器学习？" maxlength="5000" required></textarea><div class="toolbar"><span id="status" role="status">首次提问需要加载模型，请稍候。</span><button id="send">发送问题 ↗</button></div></form><footer>料包——2026.10.30全网首发——采用Qwen3-0.6B训练</footer></main><script>
let mode='通俗',busy=false;const q=document.querySelector('#question'),send=document.querySelector('#send'),status=document.querySelector('#status'),messages=document.querySelector('#messages');document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});function add(label,text,cls=''){document.querySelector('#empty')?.remove();let box=document.createElement('div');box.className='message '+cls;let title=document.createElement('div');title.className='label';title.textContent=label;let content=document.createElement('div');content.textContent=text;box.append(title,content);messages.append(box);box.scrollIntoView({behavior:'smooth',block:'nearest'});return content}document.querySelector('#clear').onclick=()=>{if(!busy)messages.replaceChildren()};document.querySelector('#form').onsubmit=async e=>{e.preventDefault();if(busy||!q.value.trim())return;busy=true;send.disabled=true;document.querySelector('#clear').disabled=true;let question=q.value.trim(),selected=mode;add('你',question,'question');let response=add('料包 · '+selected,'正在思考…');status.textContent='正在生成，首次使用会先加载模型…';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,mode:selected})});let data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');response.textContent=data.answer+(data.truncated?'\n\n[达到长度上限，回答可能未完成]':'');q.value='';status.textContent='回答完成，可以继续提问。'}catch(err){response.textContent=err.message;status.textContent='未完成，请重试。'}finally{busy=false;send.disabled=false;document.querySelector('#clear').disabled=false}};
</script></html>
